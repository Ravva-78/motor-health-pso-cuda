[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeroforge"
version = "1.0.0"
description = "Autonomous Predictive Edge AI Platform for High-Frequency Industrial Motor Health Monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Ravva Nagarjun", email = "ravvanagarjun@gmail.com" }
]
keywords = [
    "edge-ai",
    "predictive-maintenance",
    "onnx-runtime",
    "tensorrt",
    "cuda",
    "particle-swarm-optimization",
    "iot",
    "industrial-monitoring",
    "drift-detection"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Monitoring"
]
dependencies = [
    "numpy>=1.24.0,<2.0.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "numba>=0.59.0",
    "pandas>=2.0.0",
    "plotly>=5.18.0",
    "streamlit>=1.32.0",
    "pyyaml>=6.0",
    "imbalanced-learn>=0.11.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "paho-mqtt>=1.6.0",
    "pyzmq>=24.0.0",
    "onnx>=1.14.0",
    "onnxruntime>=1.15.0",
    "skl2onnx>=1.15.0",
    "shap>=0.44.0",
    "fastapi>=0.100.0",
    "httpx>=0.24.0",
    "uvicorn>=0.20.0",
    "requests>=2.31.0"
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "flake8>=6.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0"
]
gpu = [
    "onnxruntime-gpu>=1.15.0"
]

[project.urls]
Homepage = "https://github.com/Ravva-78/motor-health-pso-cuda"
Documentation = "https://github.com/Ravva-78/motor-health-pso-cuda/tree/main/docs"
Repository = "https://github.com/Ravva-78/motor-health-pso-cuda.git"
Issues = "https://github.com/Ravva-78/motor-health-pso-cuda/issues"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-v --tb=short --strict-markers"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.pytest_cache
  | \.venv
  | build
  | dist
)/
'''

[tool.coverage.run]
source = ["backend"]
omit = [
    "tests/*",
    "scripts/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "except ImportError:",
    "if _GPU_AVAILABLE:"
]
show_missing = true
